<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <header class="topbar">
    <p class="prompt"><span class="user">slobodan</span>@<span class="host">blog</span>:<span class="path">~/posts</span>$</p>
    <nav>
      <a href="{{ '/' | prepend: site.baseurl }}">home</a>
      <a href="https://github.com/SlobodanBogdanovic">GitHub</a>
      <a href="https://www.linkedin.com/in/bogdanovics">LinkedIn</a>
    </nav>
  </header>
  <article class="post">
    <p class="post-date">{{ page.date | date: "%Y-%m-%d" }}</p>
    {% if page.tags %}
    <p class="tags">{% for tag in page.tags %}<span>{{ tag }}</span> {% endfor %}</p>
    {% endif %}
    <h1><span class="mark">#</span> {{ page.title }}</h1>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
</body>
</html>
