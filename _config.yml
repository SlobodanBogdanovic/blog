remote_theme: "mmistakes/minimal-mistakes@4.24.0"
plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

title: "Slobodan Bogdanović"
name: "Slobodan Bogdanović"
description: "Quality & Delivery Lead. Writing about software quality and engineering."
url: "https://slobodanbogdanovic.github.io"
baseurl: "/blog"

author:
  name: "Slobodan Bogdanović"
  bio: "Quality & Delivery Lead. Writing about software quality and engineering."
  location: "Serbia"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/bogdanovics"

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true

paginate: 5
paginate_path: /page:num/
